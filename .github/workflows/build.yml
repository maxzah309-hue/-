name: iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: ScheduleKit tests
        run: swift test --package-path ScheduleKit

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        run: |
          xcodebuild build \
            -project Raspisanie.xcodeproj \
            -scheme Raspisanie \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/Raspisanie.app
          GROUP=$(xcodebuild -project Raspisanie.xcodeproj -target Raspisanie -showBuildSettings 2>/dev/null \
            | awk -F ' = ' '$1 ~ / APP_GROUP_ID$/ { print $2 }')
          sed "s/\$(APP_GROUP_ID)/$GROUP/" Config/Raspisanie.entitlements > app.entitlements
          # Ad-hoc подпись только зашивает entitlements; Sideloadly/AltStore переподпишут приложение своим Apple ID.
          codesign --force --sign - --entitlements app.entitlements "$APP/PlugIns/RaspisanieWidget.appex"
          codesign --force --sign - --entitlements app.entitlements "$APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Raspisanie-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Raspisanie-ipa
          path: Raspisanie-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: xcodeproj
          path: Raspisanie.xcodeproj
