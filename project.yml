# Xcode-проект генерируется из этого файла: brew install xcodegen && xcodegen generate
name: Raspisanie

options:
  bundleIdPrefix: io.github.maxzah309
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    # Свою команду можно выбрать в Xcode: Signing & Capabilities → Team.
    DEVELOPMENT_TEAM: ""
    # Общая папка приложения и виджета. Если Xcode скажет, что имя занято, поменяйте его здесь.
    APP_GROUP_ID: group.io.github.maxzah309.raspisanie

packages:
  ScheduleKit:
    path: ScheduleKit

targets:
  Raspisanie:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: ScheduleKit
      - target: RaspisanieWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.maxzah309.raspisanie
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Raspisanie.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  RaspisanieWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    dependencies:
      - package: ScheduleKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.maxzah309.raspisanie.widget
        INFOPLIST_FILE: Config/Widget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/RaspisanieWidget.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  Raspisanie:
    build:
      targets:
        Raspisanie: all
    run:
      config: Debug
    archive:
      config: Release
